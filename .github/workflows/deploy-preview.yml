name: Deploy Preview

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'wp-content/themes/**'

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify gallery output exists
        shell: bash
        run: test -f docs/index.html
