name: Validate Theme

on:
  push:
    paths:
      - 'wp-content/themes/**'
      - 'docs/**'
      - 'scripts/**'
      - 'contracts/**'
      - 'agents/**'
      - 'instructions/**'
  pull_request:
    paths:
      - 'wp-content/themes/**'
      - 'docs/**'
      - 'scripts/**'
      - 'contracts/**'
      - 'agents/**'
      - 'instructions/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated themes
        shell: bash
        run: bash scripts/validate-all.sh
